<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pra onde foi?</title>

<!-- Faz o app ter cara de aplicativo quando adicionado à tela inicial do celular -->
<meta name="theme-color" content="#13241D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pra onde foi?" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2313241D'/%3E%3Ctext x='50' y='70' font-size='58' font-family='monospace' font-weight='bold' fill='%23E4572E' text-anchor='middle'%3E£%3C/text%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2313241D'/%3E%3Ctext x='50' y='70' font-size='58' font-family='monospace' font-weight='bold' fill='%23E4572E' text-anchor='middle'%3E£%3C/text%3E%3C/svg%3E" />

<style>
  :root {
    --bg: #13241D;
    --panel: #1D3329;
    --border: #2C4A3C;
    --cream: #E8E1D2;
    --muted: #A9A296;
    --spent: #E4572E;
    --paper: #F4EFE3;
    --ink: #2A2622;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 440px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .eyebrow { color: var(--spent); letter-spacing: 0.18em; font-size: 11px; font-weight: 700; }
  h1 { font-size: 26px; margin-top: 4px; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .row { display: flex; gap: 8px; margin-top: 20px; }
  input {
    flex: 1; padding: 13px 16px; border-radius: 12px; font-size: 14px;
    background: var(--panel); color: var(--cream); border: 1px solid var(--border); outline: none;
  }
  input::placeholder { color: #6E786F; }
  button.primary {
    padding: 13px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
    background: var(--spent); color: #fff; border: none; cursor: pointer;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
  }

  .summary { margin-top: 24px; border-radius: 16px; padding: 20px; background: var(--panel); border: 1px solid var(--border); }
  .summary .label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .summary .total { font-size: 40px; font-weight: 700; color: var(--spent); margin-top: 2px; }
  .summary .note { font-size: 14px; margin-top: 8px; color: var(--cream); }

  .receipt { margin-top: 24px; border-radius: 16px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .receipt .head { padding: 16px 20px 6px; color: #8C8072; font-size: 11px; letter-spacing: 0.12em; }
  .receipt .body { padding: 0 20px 16px; }
  .empty { padding: 32px 20px; text-align: center; color: #8C8072; font-size: 13px; line-height: 1.6; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #D8CFBC; font-size: 14px; }
  .item .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .item .desc { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .cat { font-size: 11px; color: #8C8072; }
  .item .right { display: flex; align-items: center; gap: 12px; }
  .item .amount { font-weight: 700; color: var(--ink); }
  .del { background: none; border: none; color: #C0B6A2; cursor: pointer; font-size: 13px; }
  .grand { display: flex; justify-content: space-between; padding-top: 12px; font-weight: 700; color: var(--ink); font-size: 14px; }

  .day { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; margin-top: 4px; border-top: 1px solid #E0D7C4; }
  .day:first-child { border-top: none; margin-top: 0; padding-top: 4px; }
  .day-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6355; font-weight: 700; }
  .day-total { font-size: 12px; color: #8C8072; font-weight: 700; }

  .fixed { margin-top: 16px; border-radius: 16px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--border); }
  .fixed-top { display: flex; justify-content: space-between; align-items: baseline; }
  .fixed-title { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  .fixed-total { font-size: 20px; font-weight: 700; color: var(--cream); }
  .fixed-row { margin-top: 12px; }
  .fixed-list { margin-top: 6px; }
  .fixed-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .fixed-item:last-child { border-bottom: none; }
  .fx-name { color: var(--cream); }
  .fx-right { display: flex; align-items: center; gap: 12px; }
  .fx-amount { color: var(--cream); font-weight: 700; }
  .fixed-empty { font-size: 13px; color: #6E786F; padding: 8px 0 2px; }
  .fixed-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fixed-sub b { color: var(--spent); }
  .fx-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .fx-info { display: flex; flex-direction: column; min-width: 0; }
  .fx-due { font-size: 11px; color: #8C8072; }
  .check { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #4A6152; background: transparent; color: #fff; font-size: 12px; line-height: 1; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
  .check.on { background: #3E7C5A; border-color: #3E7C5A; }
  .fixed-item.paid .fx-name, .fixed-item.paid .fx-amount { text-decoration: line-through; opacity: 0.5; }

  .disclaimer { font-size: 11px; text-align: center; margin-top: 16px; color: #6E786F; }
</style>
</head>
<body>
  <div class="app">
    <div>
      <div class="eyebrow mono">SEU DINHEIRO, SEM ENROLAÇÃO</div>
      <h1>Pra onde foi?</h1>
      <div class="sub">Escreve do seu jeito, tipo "gastei 15 no uber". O app anota e organiza.</div>
    </div>

    <div class="row">
      <input id="input" placeholder="o que você gastou?" autocomplete="off" />
      <button class="primary" id="addBtn">Anotar</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="summary">
      <div class="label mono">TOTAL GASTO</div>
      <div class="total mono" id="total">£0.00</div>
      <div class="note" id="note"></div>
    </div>

    <div class="fixed">
      <div class="fixed-top">
        <span class="fixed-title mono">FIXOS POR MÊS</span>
        <span class="fixed-total mono" id="fixedTotal">£0.00</span>
      </div>
      <div class="fixed-sub" id="fixedSub"></div>
      <div class="row fixed-row">
        <input id="fixedInput" placeholder="ex: academia 30 dia 15" autocomplete="off" />
        <button class="primary" id="fixedBtn">+ Fixo</button>
      </div>
      <div id="fixedList" class="fixed-list"></div>
    </div>

    <div class="receipt">
      <div class="head mono">———— SEUS GASTOS ————</div>
      <div class="body mono" id="list"></div>
    </div>

    <div class="disclaimer">Organiza e mostra pra onde vai o dinheiro. Não dá dica de investimento.</div>
  </div>

<script>
  // ---- As categorias e suas cores ----
  const CATEGORIES = {
    "Alimentação": "#E4572E",
    "Transporte":  "#3E7C5A",
    "Mercado":     "#C99A2E",
    "Lazer":       "#8A5CD1",
    "Contas":      "#2E86AB",
    "Compras":     "#D14D8A",
    "Saúde":       "#3EA39E",
    "Outros":      "#8C8072",
  };
  const EXAMPLES = ["gastei 15 no uber", "£8 no ifood", "30 de mercado", "12 no cinema"];

  // ---- O CÉREBRO (versão por palavra-chave) ----
  // Lê o texto, acha o valor e decide a categoria pelas palavras que aparecem.
  function parse(text) {
    const match = text.match(/(\d+(?:[.,]\d{1,2})?)/);
    const amount = match ? parseFloat(match[1].replace(",", ".")) : 0;
    const s = text.toLowerCase();

    let category = "Outros";
    if (/uber|99|[oô]nibus|metr[oô]|trem|gasolina|transporte|passagem/.test(s)) category = "Transporte";
    else if (/mercado|supermerc|feira|hortifruti/.test(s)) category = "Mercado";
    else if (/comida|almo[cç]|jant|lanch|ifood|restaurante|caf[eé]|pizza|burger|padaria|hamb/.test(s)) category = "Alimentação";
    else if (/cinema|jogo|bar|balada|netflix|spotify|lazer|show|role|rol[eê]|golfe|boliche|paintball|sinuca|kart|parque/.test(s)) category = "Lazer";
    else if (/conta|luz|[aá]gua|aluguel|internet|telefone|celular|fatura/.test(s)) category = "Contas";
    else if (/roupa|t[eê]nis|compra|amazon|loja|shopping|shein/.test(s)) category = "Compras";
    else if (/farm[aá]cia|rem[eé]dio|m[eé]dico|academia|dentista/.test(s)) category = "Saúde";

    // Monta uma descrição curtinha limpando o texto
    let desc = s
      .replace(/gastei|paguei|comprei|gasto/g, "")
      .replace(/\d+(?:[.,]\d+)?/g, "")
      .replace(/£|r\$|reais|libras?/g, "")
      .replace(/\b(no|na|nos|nas|de|do|da|em|com|pra|para|o|a|um|uma)\b/g, "")
      .replace(/\s+/g, " ").trim();
    if (!desc) desc = category;
    desc = desc.charAt(0).toUpperCase() + desc.slice(1);

    return { amount, category, description: desc };
  }

  // ---- A MEMÓRIA (localStorage: o "chapeleiro" no navegador) ----
  function load() {
    try { return JSON.parse(localStorage.getItem("expenses") || "[]"); }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem("expenses", JSON.stringify(expenses)); }

  let expenses = load();

  // ---- Gastos fixos (repetem todo mês: academia, netflix, aluguel...) ----
  function loadFixed() {
    try { return JSON.parse(localStorage.getItem("recurring") || "[]"); }
    catch (e) { return []; }
  }
  function saveFixed() { localStorage.setItem("recurring", JSON.stringify(recurring)); }
  let recurring = loadFixed();

  // ---- Ações ----
  function addExpense(msg) {
    const text = (msg !== undefined ? msg : input.value).trim();
    if (!text) return;
    const p = parse(text);
    expenses.unshift({ id: Date.now(), date: new Date().toISOString(), ...p });
    save();
    input.value = "";
    render();
  }
  function removeExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    save();
    render();
  }

  // Lê "academia 30 dia 15" e separa nome + valor + dia do desconto
  function parseFixed(text) {
    let s = text;
    // 1) tira o "dia N" primeiro, pra ele não ser confundido com o valor
    let dueDay = null;
    const dm = s.match(/dia\s*(\d{1,2})/i);
    if (dm) { const d = parseInt(dm[1], 10); if (d >= 1 && d <= 31) dueDay = d; s = s.replace(dm[0], ""); }
    // 2) agora o primeiro número que sobrar é o valor
    const m = s.match(/(\d+(?:[.,]\d{1,2})?)/);
    const amount = m ? parseFloat(m[1].replace(",", ".")) : 0;
    let name = s.replace(/\d+(?:[.,]\d+)?/g, "").replace(/£|r\$|reais|libras?/gi, "").replace(/\s+/g, " ").trim();
    if (!name) name = "Fixo";
    name = name.charAt(0).toUpperCase() + name.slice(1);
    return { name, amount, dueDay };
  }
  function addFixed() {
    const text = fixedInput.value.trim();
    if (!text) return;
    recurring.unshift({ id: Date.now(), ...parseFixed(text) });
    saveFixed();
    fixedInput.value = "";
    renderFixed();
  }
  function removeFixed(id) {
    recurring = recurring.filter(x => x.id !== id);
    saveFixed();
    renderFixed();
  }
  // "Mês atual" tipo "2026-7". É a chave da mágica do reset automático.
  function monthKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1); }
  // Um fixo está "pago" só se foi marcado NESTE mês. Mês que vem, a chave muda e ele volta sozinho.
  function isPaid(f) { return f.paidMonth === monthKey(); }
  function togglePaid(id) {
    const f = recurring.find(x => x.id === id);
    if (!f) return;
    f.paidMonth = isPaid(f) ? null : monthKey();
    saveFixed();
    renderFixed();
  }

  const money = n => "£" + (Number(n) || 0).toFixed(2);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // ---- Datas ----
  // Pega a hora do gasto. Gastos antigos (salvos antes dessa atualização) não têm
  // o campo "date", então a gente usa o "id" — que também é a hora da criação.
  const ts = e => e.date ? new Date(e.date).getTime() : e.id;
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  function dayLabel(t) {
    const d = new Date(t), now = new Date();
    const yest = new Date(); yest.setDate(now.getDate() - 1);
    if (dayKey(t) === dayKey(now)) return "Hoje";
    if (dayKey(t) === dayKey(yest)) return "Ontem";
    const dias = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return dias[d.getDay()] + ", " + dd + "/" + mm;
  }

  // ---- Desenha a tela ----
  const input = document.getElementById("input");
  const listEl = document.getElementById("list");
  const totalEl = document.getElementById("total");
  const noteEl = document.getElementById("note");
  const fixedInput = document.getElementById("fixedInput");
  const fixedListEl = document.getElementById("fixedList");
  const fixedTotalEl = document.getElementById("fixedTotal");
  const fixedSubEl = document.getElementById("fixedSub");

  function render() {
    const total = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    totalEl.textContent = money(total);

    // Acha a maior categoria pra dar o "tapa de consciência"
    const byCat = {};
    expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
    const biggest = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    if (biggest) {
      const heavy = biggest[1] > total * 0.4 ? "Tá pesando bastante, hein." : "Sob controle por enquanto.";
      noteEl.innerHTML = 'Maior peso: <b style="color:' + CATEGORIES[biggest[0]] + '">' + biggest[0] + '</b> (' + money(biggest[1]) + '). ' + heavy;
    } else {
      noteEl.textContent = "";
    }

    if (expenses.length === 0) {
      listEl.innerHTML = '<div class="empty">Nada anotado ainda.<br>Toca num exemplo aí em cima pra ver funcionar.</div>';
      return;
    }

    // Agrupa os gastos por dia, mantendo a ordem (mais novo primeiro)
    const groups = [];
    expenses.forEach(e => {
      const key = dayKey(ts(e));
      let g = groups.find(x => x.key === key);
      if (!g) { g = { key: key, label: dayLabel(ts(e)), total: 0, items: [] }; groups.push(g); }
      g.total += Number(e.amount) || 0;
      g.items.push(e);
    });

    const itemHtml = e =>
      '<div class="item">' +
        '<div class="left">' +
          '<span class="dot" style="background:' + CATEGORIES[e.category] + '"></span>' +
          '<div style="min-width:0">' +
            '<div class="desc">' + esc(e.description) + '</div>' +
            '<div class="cat">' + e.category + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="right">' +
          '<span class="amount">' + money(e.amount) + '</span>' +
          '<button class="del" onclick="removeExpense(' + e.id + ')">✕</button>' +
        '</div>' +
      '</div>';

    listEl.innerHTML =
      groups.map(g =>
        '<div class="day"><span class="day-label">' + g.label + '</span>' +
        '<span class="day-total">' + money(g.total) + '</span></div>' +
        g.items.map(itemHtml).join("")
      ).join("") +
      '<div class="grand"><span>TOTAL GERAL</span><span>' + money(total) + '</span></div>';
  }

  // ---- Desenha os fixos ----
  function renderFixed() {
    const total = recurring.reduce((s, f) => s + (Number(f.amount) || 0), 0);
    fixedTotalEl.textContent = money(total) + "/mês";

    // "Falta sair" = só os fixos que ainda não foram marcados como pagos neste mês
    const unpaid = recurring.filter(f => !isPaid(f)).reduce((s, f) => s + (Number(f.amount) || 0), 0);
    if (recurring.length === 0) fixedSubEl.textContent = "";
    else if (unpaid === 0) fixedSubEl.innerHTML = "Tudo pago esse mês ✅";
    else fixedSubEl.innerHTML = "Falta sair esse mês: <b>" + money(unpaid) + "</b>";

    if (recurring.length === 0) {
      fixedListEl.innerHTML = '<div class="fixed-empty">Nenhum fixo ainda. Ex: "academia 30 dia 15".</div>';
      return;
    }
    // Ordena por dia do desconto, do menor pro maior. Fixos sem dia vão pro fim.
    const sorted = [...recurring].sort((a, b) => (a.dueDay || 999) - (b.dueDay || 999));
    fixedListEl.innerHTML = sorted.map(f => {
      const paid = isPaid(f);
      return '<div class="fixed-item' + (paid ? ' paid' : '') + '">' +
        '<span class="fx-left">' +
          '<button class="check' + (paid ? ' on' : '') + '" onclick="togglePaid(' + f.id + ')">' + (paid ? '✓' : '') + '</button>' +
          '<span class="fx-info">' +
            '<span class="fx-name">' + esc(f.name) + '</span>' +
            (f.dueDay ? '<span class="fx-due">cai dia ' + f.dueDay + '</span>' : '') +
          '</span>' +
        '</span>' +
        '<span class="fx-right">' +
          '<span class="fx-amount">' + money(f.amount) + '</span>' +
          '<button class="del" onclick="removeFixed(' + f.id + ')">✕</button>' +
        '</span>' +
      '</div>';
    }).join("");
  }

  // ---- Liga os botões ----
  document.getElementById("addBtn").onclick = () => addExpense();
  input.addEventListener("keydown", e => { if (e.key === "Enter") addExpense(); });
  document.getElementById("fixedBtn").onclick = () => addFixed();
  fixedInput.addEventListener("keydown", e => { if (e.key === "Enter") addFixed(); });

  document.getElementById("chips").innerHTML =
    EXAMPLES.map(ex => '<button class="chip" onclick="addExpense(\'' + ex + '\')">' + ex + '</button>').join("");

  render();
  renderFixed();
</script>
</body>
</html>
