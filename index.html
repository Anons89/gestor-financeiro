<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>BudgetAI</title>

<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BudgetAI" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Crect x='22' y='23' width='56' height='50' rx='7' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Ccircle cx='45' cy='48' r='12' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Ccircle cx='45' cy='48' r='2.6' fill='%23FFFFFF'/%3E%3Cline x1='45' y1='48' x2='45' y2='39' stroke='%23FFFFFF' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='66' y1='41' x2='66' y2='55' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='30' y1='73' x2='30' y2='79' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='70' y1='73' x2='70' y2='79' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000000'/%3E%3Crect x='22' y='23' width='56' height='50' rx='7' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Ccircle cx='45' cy='48' r='12' fill='none' stroke='%23FFFFFF' stroke-width='5'/%3E%3Ccircle cx='45' cy='48' r='2.6' fill='%23FFFFFF'/%3E%3Cline x1='45' y1='48' x2='45' y2='39' stroke='%23FFFFFF' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='66' y1='41' x2='66' y2='55' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='30' y1='73' x2='30' y2='79' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='70' y1='73' x2='70' y2='79' stroke='%23FFFFFF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />

<style>
  :root {
    --bg: #000000; --panel: #14161C; --border: #262A33; --cream: #E9ECF5;
    --muted: #98A0B8; --spent: #4ADE80; --paper: #F3F3F9; --ink: #23232E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: calc(44px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 440px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { background: var(--panel); border: 1px solid var(--border); color: var(--cream); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .head-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .eyebrow { color: var(--spent); letter-spacing: 0.18em; font-size: 11px; font-weight: 700; }
  h1 { font-size: 26px; margin-top: 4px; letter-spacing: -0.01em; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; padding: 13px 16px; border-radius: 12px; font-size: 14px; background: var(--panel); color: var(--cream); border: 1px solid var(--border); outline: none; }
  input::placeholder { color: #6C7391; }
  button.primary { padding: 13px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; background: var(--spent); color: #05230F; border: none; cursor: pointer; white-space: nowrap; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer; background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .chip-editing { display: inline-flex; align-items: center; border-style: dashed; color: var(--cream); }
  .chip-x { background: none; border: none; color: var(--muted); cursor: pointer; margin-left: 6px; font-size: 11px; padding: 0; }
  .chip-input { flex: none; width: 140px; font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--panel); color: var(--cream); border: 1px solid var(--border); outline: none; }

  .fixed { margin-top: 16px; border-radius: 16px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--border); }
  .fixed-top { display: flex; justify-content: space-between; align-items: baseline; }
  .fixed-title { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  .fixed-total { font-size: 20px; font-weight: 700; color: var(--cream); }
  .fixed-row { margin-top: 12px; }
  .fixed-list { margin-top: 6px; }
  .fixed-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .fixed-item:last-child { border-bottom: none; }
  .fixed-empty { font-size: 13px; color: #6C7391; padding: 8px 0 2px; }
  .fixed-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fixed-sub b { color: var(--spent); }
  .fx-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .fx-info { display: flex; flex-direction: column; min-width: 0; }
  .fx-name { color: var(--cream); }
  .fx-due { font-size: 11px; color: #8890A6; }
  .fx-right { display: flex; align-items: center; gap: 12px; }
  .fx-amount { color: var(--cream); font-weight: 700; }
  .fx-del { background: none; border: none; color: #7C86A0; cursor: pointer; font-size: 13px; }
  .check { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid #38425C; background: transparent; color: #fff; font-size: 12px; line-height: 1; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
  .check.on { background: #34C77B; border-color: #34C77B; }
  .fixed-item.paid .fx-name, .fixed-item.paid .fx-amount { text-decoration: line-through; opacity: 0.5; }

  .summary { margin-top: 22px; border-radius: 16px; padding: 20px; background: var(--panel); border: 1px solid var(--border); }
  .summary .label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
  .summary .total { font-size: 40px; font-weight: 700; color: var(--spent); margin-top: 2px; }
  .summary .note { font-size: 14px; margin-top: 8px; color: var(--cream); }

  .receipt { margin-top: 16px; border-radius: 16px; overflow: hidden; background: var(--paper); color: var(--ink); }
  .receipt .head { padding: 16px 20px 6px; color: #8A8A9A; font-size: 11px; letter-spacing: 0.12em; }
  .receipt .body { padding: 0 20px 16px; }
  .empty { padding: 32px 20px; text-align: center; color: #8A8A9A; font-size: 13px; line-height: 1.6; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #E0E0EA; font-size: 14px; }
  .item .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .item .desc { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .cat { font-size: 11px; color: #8A8A9A; }
  .item .right { display: flex; align-items: center; gap: 12px; }
  .item .amount { font-weight: 700; color: var(--ink); }
  .del { background: none; border: none; color: #B4B4C2; cursor: pointer; font-size: 13px; }
  .day { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; margin-top: 4px; border-top: 1px solid #E7E7EF; }
  .day:first-child { border-top: none; margin-top: 0; padding-top: 4px; }
  .day-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6C6C7C; font-weight: 700; }
  .day-total { font-size: 12px; color: #8A8A9A; font-weight: 700; }

  .tabs { display: flex; gap: 8px; margin-top: 18px; }
  .tab { flex: 1; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 700; background: var(--panel); color: var(--muted); border: 1px solid var(--border); cursor: pointer; }
  .tab.active { background: var(--spent); color: #05230F; border-color: var(--spent); }
  .profile { border-radius: 16px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); margin-top: 20px; }
  .profile-title { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 8px; }
  .profile-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .profile input, .profile select { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; font-size: 12px; background: var(--bg); color: var(--cream); border: 1px solid var(--border); outline: none; }
  .chat { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--spent); color: #05230F; }
  .msg.bot { align-self: flex-start; background: var(--panel); color: var(--cream); border: 1px solid var(--border); }
  .thinking { font-size: 12px; color: var(--muted); padding: 2px 4px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .coach-input-row { display: flex; gap: 8px; margin-top: 12px; }

  .bubble { position: fixed; z-index: 50; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 999px; background: linear-gradient(140deg, #5AE88F 0%, #22C55E 100%); color: #04220E; font-weight: 800; font-size: 15px; letter-spacing: 0.5px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; box-shadow: 0 8px 22px rgba(0,0,0,0.5); animation: bubblePing 2.6s ease-out infinite; }
  @keyframes bubblePing {
    0% { box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 0 15px rgba(74,222,128,0); }
    100% { box-shadow: 0 8px 22px rgba(0,0,0,0.5), 0 0 0 0 rgba(74,222,128,0); }
  }
  .sheet { position: fixed; inset: 0; z-index: 60; display: none; }
  .sheet.open { display: block; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.35); }
  .sheet-panel { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 440px; height: 82vh; background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-top-left-radius: 20px; border-top-right-radius: 20px; transition: transform 0.28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
  .sheet.open .sheet-panel { transform: translateX(-50%) translateY(0); }
  .sheet-grip { padding: 10px 0 4px; display: flex; justify-content: center; cursor: grab; touch-action: none; flex-shrink: 0; }
  .grip-bar { width: 40px; height: 5px; border-radius: 999px; background: var(--border); }
  .sheet-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .sheet-body .profile { margin-top: 6px; }
  .sheet-body .chat { flex: 1; overflow-y: auto; min-height: 0; margin-top: 12px; }

  .compare { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .curbar { position: relative; display: inline-block; }
  .cur-toggle { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--panel); color: var(--cream); border: 1px solid var(--border); cursor: pointer; }
  .caret { color: var(--muted); font-size: 12px; }
  .cur-menu { position: absolute; top: calc(100% + 6px); right: 0; left: auto; z-index: 40; min-width: 170px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,0.55); display: none; }
  .cur-menu.open { display: block; }
  .cur-opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; background: none; border: none; color: var(--cream); cursor: pointer; }
  .cur-opt.active { color: var(--spent); font-weight: 700; }
  .cur-opt.local { border-top: 1px solid var(--border); margin-top: 4px; color: var(--muted); }
  .othercur { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .act { flex: 1; padding: 11px; border-radius: 12px; font-size: 13px; font-weight: 600; background: var(--panel); color: var(--cream); border: 1px solid var(--border); cursor: pointer; }
  @media print {
    body { background: #fff !important; color: #000 !important; padding: 12px !important; }
    .tabs, .row, .chips, .lang, .actions, .curbar, .bubble, .sheet, .disclaimer, .del, .fx-del, .check, .sub, .logout-wrap { display: none !important; }
    .summary, .fixed { background: #fff !important; color: #000 !important; border: 1px solid #ddd !important; }
    .summary .total, .eyebrow, h1, .fixed-title, .label, .fixed-total, .fx-name, .fx-amount, .fx-due, .compare, .note, .fixed-sub { color: #000 !important; }
  }

  .disclaimer { font-size: 11px; text-align: center; margin-top: 16px; color: #6C7391; }

  /* ---- Tela de login ---- */
  .auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left)); }
  .auth-screen.hidden { display: none; }
  .auth-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .auth-logo { width: 68px; height: 68px; margin: 0 auto 2px; display: block; }
  .auth-brand { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .auth-tag { font-size: 14px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
  .auth-card input { width: 100%; text-align: left; }
  .auth-btn { width: 100%; }
  .auth-btn2 { width: 100%; background: transparent; color: var(--spent); border: 1px solid var(--border); padding: 13px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .auth-msg { font-size: 13px; min-height: 18px; color: var(--muted); line-height: 1.4; }
  .auth-msg.err { color: #FF6B5E; }
  .auth-msg.ok { color: var(--spent); }

  .logout-wrap { text-align: center; margin-top: 20px; }
  .logout-btn { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <svg class="auth-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#000000"/><rect x="22" y="23" width="56" height="50" rx="7" fill="none" stroke="#FFFFFF" stroke-width="5"/><circle cx="45" cy="48" r="12" fill="none" stroke="#FFFFFF" stroke-width="5"/><circle cx="45" cy="48" r="2.6" fill="#FFFFFF"/><line x1="45" y1="48" x2="45" y2="39" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><line x1="66" y1="41" x2="66" y2="55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="73" x2="30" y2="79" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="73" x2="70" y2="79" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/></svg>
      <div class="auth-brand">BudgetAI</div>
      <div class="auth-tag" id="authTag"></div>
      <input id="authEmail" type="email" autocomplete="email" />
      <input id="authPass" type="password" autocomplete="current-password" />
      <button class="primary auth-btn" id="authLoginBtn"></button>
      <button class="auth-btn2" id="authSignupBtn"></button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <div class="app">
    <div class="head-row">
      <div>
        <div class="eyebrow mono" id="eyebrow"></div>
        <h1 id="title"></h1>
      </div>
      <div class="head-controls">
        <div class="curbar" id="curbar"></div>
        <button class="lang" id="langBtn"></button>
      </div>
    </div>
    <div class="sub" id="sub"></div>

    <div id="viewGastos">
    <div class="row">
      <input id="input" autocomplete="off" />
      <button class="primary" id="addBtn"></button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="summary">
      <div class="label mono" id="totalLabel"></div>
      <div class="total mono" id="total">£0.00</div>
      <div class="note" id="note"></div>
      <div class="compare" id="compare"></div>
      <div class="othercur" id="othercur"></div>
    </div>

    <div class="fixed">
      <div class="fixed-top">
        <span class="fixed-title mono" id="fixedTitleEl"></span>
        <span class="fixed-total mono" id="fixedTotal">£0.00</span>
      </div>
      <div class="fixed-sub" id="fixedSub"></div>
      <div class="row fixed-row">
        <input id="fixedInput" autocomplete="off" />
        <button class="primary" id="fixedBtn"></button>
      </div>
      <div id="fixedList" class="fixed-list"></div>
    </div>

    <div class="receipt">
      <div class="head mono" id="receiptHead"></div>
      <div class="body mono" id="list"></div>
    </div>

    <div class="actions">
      <button class="act" id="shareBtn"></button>
      <button class="act" id="pdfBtn"></button>
    </div>
    </div><!-- /viewGastos -->

    <div class="disclaimer" id="disclaimer"></div>

    <div class="logout-wrap"><button id="logoutBtn" class="logout-btn"></button></div>

    <button id="coachBubble" class="bubble">AI</button>

    <div id="coachSheet" class="sheet">
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet-panel" id="sheetPanel">
        <div class="sheet-grip" id="sheetGrip"><span class="grip-bar"></span></div>
        <div class="sheet-body">
          <div class="profile">
            <div class="profile-title" id="profileTitle"></div>
            <div class="profile-row">
              <input id="pIncome" autocomplete="off" />
              <select id="pRisk"></select>
            </div>
            <input id="pGoal" autocomplete="off" style="width:100%" />
          </div>
          <div class="chat" id="chat"></div>
          <div class="suggestions" id="suggestions"></div>
          <div class="coach-input-row">
            <input id="coachInput" autocomplete="off" />
            <button class="primary" id="coachSend"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  function detectLang() {
    try { const saved = localStorage.getItem("lang"); if (saved === "pt" || saved === "en") return saved; } catch (e) {}
    return (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en";

  let lang = detectLang();

  // ---- PLANO B do cérebro: palavra-chave (usado só se o porteiro/IA falhar) ----
  function parseLocal(text) {
    const match = text.match(/(\d+(?:[.,]\d{1,2})?)/);
    const amount = match ? parseFloat(match[1].replace(",", ".")) : 0;
    const s = text.toLowerCase();
    let category = "Outros";
    if (/uber|99|taxi|[oô]nibus|bus|metr[oô]|tube|trem|train|gasolina|petrol|fuel|transporte|transport|passagem|ride/.test(s)) category = "Transporte";
    else if (/mercado|supermerc|feira|hortifruti|groceries|grocery|supermarket|gopuff/.test(s)) category = "Mercado";
    else if (/comida|food|almo[cç]|lunch|jant|dinner|breakfast|lanch|snack|ifood|restaurante|restaurant|caf[eé]|coffee|pizza|burger|padaria|hamb|meal|takeaway/.test(s)) category = "Alimentação";
    else if (/cinema|movie|jogo|game|bar|pub|balada|club|netflix|spotify|lazer|leisure|show|concert|role|rol[eê]|golfe|golf|boliche|bowling|paintball|sinuca|kart|parque/.test(s)) category = "Lazer";
    else if (/conta|bill|luz|electricity|[aá]gua|water|aluguel|rent|internet|telefone|phone|celular|fatura/.test(s)) category = "Contas";
    else if (/roupa|clothes|t[eê]nis|compra|shopping|amazon|loja|shop|shein/.test(s)) category = "Compras";
    else if (/farm[aá]cia|pharmacy|rem[eé]dio|medicine|m[eé]dico|doctor|academia|gym|dentista|dentist/.test(s)) category = "Saúde";
    let desc = s
      .replace(/\b(gastei|paguei|comprei|gasto|spent|paid|bought)\b/g, "")
      .replace(/\d+(?:[.,]\d+)?/g, "").replace(/£|€|\$|r\$|reais|libras?|pounds?|euros?|d[oó]lares?|dollars?/gi, "")
      .replace(/\b(no|na|nos|nas|de|do|da|em|com|pra|para|o|a|um|uma|on|at|for|the|of|to|with|an)\b/g, "")
      .replace(/\s+/g, " ").trim();
    if (!desc) desc = catLabel(category);
    desc = desc.charAt(0).toUpperCase() + desc.slice(1);
    return { amount, category, description: desc };
  }

  // ---- O CÉREBRO DE VERDADE: chama o porteiro (Netlify Function -> NVIDIA). Se falhar, usa o plano B. ----
  async function parse(text) {
    try {
      const res = await fetch("/.netlify/functions/categorize", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      });
      const data = await res.json();
      if (data && data.ok && typeof data.amount !== "undefined") {
        const cat = CATEGORIES[data.category] ? data.category : "Outros";
        return { amount: Number(data.amount) || 0, category: cat, description: (data.description || text) };
      }
    } catch (e) {}
    return parseLocal(text);
  }

  // Deixa o atalho bonito: 1ª letra maiúscula em cada palavra + moeda na frente do valor.
  function formatChip(raw) {
    const m = raw.match(/(\d+(?:[.,]\d{1,2})?)/);
    const amount = m ? parseFloat(m[1].replace(",", ".")) : 0;
    let name = raw
      .replace(/\b(gastei|paguei|comprei|gasto|spent|paid|bought)\b/gi, "")
      .replace(/\d+(?:[.,]\d+)?/g, "")
      .replace(/£|€|\$|r\$|reais|libras?|pounds?|euros?|d[oó]lares?|dollars?/gi, "")
      .replace(/\s+/g, " ").trim();
    if (!name) name = "Item";
    name = name.split(" ").map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(" ");
    const sym = CURRENCIES[homeCurrency] || "£";
    const amtStr = (amount % 1 === 0) ? String(amount) : amount.toFixed(2);
    return name + " " + sym + amtStr;
  }

  // ---- Ações: fixos mensais ----
  function parseFixed(text) {
    let s = text; let dueDay = null;
    const dm = s.match(/(?:dia|day)\s*(\d{1,2})/i);
    if (dm) { const d = parseInt(dm[1], 10); if (d >= 1 && d <= 31) dueDay = d; s = s.replace(dm[0], ""); }
    const m = s.match(/(\d+(?:[.,]\d{1,2})?)/);
    const amount = m ? parseFloat(m[1].replace(",", ".")) : 0;
    let name = s.replace(/\d+(?:[.,]\d+)?/g, "").replace(/£|r\$|reais|libras?|pounds?/gi, "").replace(/\s+/g, " ").trim();
    if (!name) name = "Fixo";
    name = name.charAt(0).toUpperCase() + name.slice(1);
    return { name, amount, dueDay };
  }

  // ---- Utilidades ----

  const CURRENCIES = { GBP: "£", EUR: "€", USD: "$", BRL: "R$", JPY: "¥", AUD: "A$", CAD: "C$", CHF: "CHF", CNY: "CN¥" };
  const FLAGS = { GBP: "🇬🇧", EUR: "🇪🇺", USD: "🇺🇸", BRL: "🇧🇷", JPY: "🇯🇵", AUD: "🇦🇺", CAD: "🇨🇦", CHF: "🇨🇭", CNY: "🇨🇳" };
  const CUR_ORDER = ["GBP", "EUR", "USD", "BRL", "JPY", "AUD", "CAD", "CHF", "CNY"];

  const expCur = e => e.cur || homeCurrency; // gastos antigos sem moeda = moeda de casa
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ts = e => e.date ? new Date(e.date).getTime() : e.id;
  const dayKey = tv => { const d = new Date(tv); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
  function dayLabel(tv) {
    const d = new Date(tv), now = new Date(); const yest = new Date(); yest.setDate(now.getDate() - 1);
    if (dayKey(tv) === dayKey(now)) return t("today");
    if (dayKey(tv) === dayKey(yest)) return t("yesterday");
    const dd = String(d.getDate()).padStart(2, "0"), mm = String(d.getMonth() + 1).padStart(2, "0");
    return t("weekdays")[d.getDay()] + ", " + dd + "/" + mm;

  // ---- Desenha os gastos do dia ----
  function render() {
    const exp = expenses.filter(e => expCur(e) === curCurrency);
    const total = exp.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    totalEl.textContent = money(total);

    const byCat = {};
    exp.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
    const biggest = Object.entries(byCat).sort((a, b) => b[1] - a[1])[0];
    if (biggest) {
      const heavy = biggest[1] > total * 0.4 ? t("heavy") : t("ok");
      noteEl.innerHTML = t("biggest") + ' <b style="color:' + CATEGORIES[biggest[0]] + '">' + catLabel(biggest[0]) + '</b> (' + money(biggest[1]) + '). ' + heavy;
    } else { noteEl.textContent = ""; }
    renderCurrencyBar();
    renderCompare();
    renderOtherCur();

    if (exp.length === 0) { listEl.innerHTML = '<div class="empty">' + t("emptyExpenses") + '</div>'; return; }

    const groups = [];
    exp.forEach(e => {
      const key = dayKey(ts(e));
      let g = groups.find(x => x.key === key);
      if (!g) { g = { key: key, label: dayLabel(ts(e)), total: 0, items: [] }; groups.push(g); }
      g.total += Number(e.amount) || 0; g.items.push(e);
    });

    const itemHtml = e =>
      '<div class="item">' +
        '<div class="left">' +
          '<span class="dot" style="background:' + CATEGORIES[e.category] + '"></span>' +
          '<div style="min-width:0">' +
            '<div class="desc">' + esc(e.description) + '</div>' +

          '<span class="amount">' + money(e.amount) + '</span>' +
          '<button class="del" onclick="removeExpense(' + e.id + ')">✕</button>' +
        '</div>' +
      '</div>';

    listEl.innerHTML = groups.map(g =>
      '<div class="day"><span class="day-label">' + g.label + '</span>' +
      '<span class="day-total">' + money(g.total) + '</span></div>' +
      g.items.map(itemHtml).join("")
    ).join("");
  }

  // ---- Desenha os fixos ----
  function renderFixed() {
    const total = recurring.reduce((s, f) => s + (Number(f.amount) || 0), 0);
    fixedTotalEl.textContent = money(total, homeCurrency) + t("perMonth");

    const unpaid = recurring.filter(f => !isPaid(f)).reduce((s, f) => s + (Number(f.amount) || 0), 0);
    if (recurring.length === 0) fixedSubEl.textContent = "";
    else if (unpaid === 0) fixedSubEl.innerHTML = t("allPaid");
    else fixedSubEl.innerHTML = t("remaining") + ' <b>' + money(unpaid, homeCurrency) + '</b>';

    if (recurring.length === 0) { fixedListEl.innerHTML = '<div class="fixed-empty">' + t("emptyFixed") + '</div>'; return; }
    const sorted = [...recurring].sort((a, b) => {
      const pa = isPaid(a) ? 1 : 0, pb = isPaid(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
      return (a.dueDay || 999) - (b.dueDay || 999);
    });
    fixedListEl.innerHTML = sorted.map(f => {
      const paid = isPaid(f);
      return '<div class="fixed-item' + (paid ? ' paid' : '') + '">' +
        '<span class="fx-left">' +
          '<button class="check' + (paid ? ' on' : '') + '" onclick="togglePaid(' + f.id + ')">' + (paid ? '✓' : '') + '</button>' +

  async function askCoach(preset) {
    const el = document.getElementById("coachInput");
    const q = (preset !== undefined ? preset : el.value).trim();
    if (!q || coachThinking) return;
    coachMessages.push({ role: "user", content: q });

    // resumo dos gastos (separado por moeda) pra dar contexto ao coach
    const spendParts = [];
    CUR_ORDER.forEach(code => {
      const exp = expenses.filter(e => expCur(e) === code);
      if (!exp.length) return;
      const tot = exp.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const bc = {}; exp.forEach(e => { bc[e.category] = (bc[e.category] || 0) + (Number(e.amount) || 0); });
      spendParts.push(money(tot, code) + " (" + Object.entries(bc).map(([c, v]) => c + " " + money(v, code)).join(", ") + ")");
    });
    const spending = spendParts.length ? spendParts.join(" | ") : "(sem gastos)";

    const payload = {
      lang: lang,
      profile: coachProfile,
      spending: spending,
      messages: coachMessages.slice(1).map(m => ({ role: m.role === "bot" ? "assistant" : "user", content: m.content })).slice(-12),
    };
    try {
      const res = await fetch("/.netlify/functions/coach", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
      });
      const data = await res.json();
      coachMessages.push({ role: "bot", content: (data && data.reply) ? data.reply : t("coachErr") });
    } catch (e) {
      coachMessages.push({ role: "bot", content: t("coachErr") });
    }
    coachThinking = false; saveCoachMsgs(); renderChat();
  }

  // ---- Comparação mês a mês ----
  function renderCompare() {
    const el = document.getElementById("compare");
    const now = new Date();
    const kThis = now.getFullYear() + "-" + now.getMonth();
    const lastD = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const kLast = lastD.getFullYear() + "-" + lastD.getMonth();
    let thisM = 0, lastM = 0;
    expenses.filter(e => expCur(e) === curCurrency).forEach(e => {
      const d = new Date(ts(e)); const k = d.getFullYear() + "-" + d.getMonth();
      if (k === kThis) thisM += Number(e.amount) || 0;
      else if (k === kLast) lastM += Number(e.amount) || 0;
    });
    if (lastM === 0) { el.innerHTML = ""; return; } // ainda não há mês passado pra comparar
    const diff = thisM - lastM;
    if (Math.abs(diff) < 0.005) { el.innerHTML = t("cmpThisMonth") + " " + money(thisM) + ". " + t("cmpSame"); return; }
    const up = diff > 0;
    const color = up ? "#F87171" : "#4ADE80";
    const arrow = up ? "↑" : "↓";
    const word = up ? t("cmpMore") : t("cmpLess");
    el.innerHTML = t("cmpThisMonth") + " " + money(thisM) + '. <span style="color:' + color + '">' + arrow + " " + money(Math.abs(diff)) + " " + word + "</span>";
  }

  // ---- Compartilhar / PDF ----
  function summaryText() {
    let out = "BudgetAI — " + t("shareTitle");
    CUR_ORDER.forEach(code => {
      const exp = expenses.filter(e => expCur(e) === code);
      if (!exp.length) return;
      const total = exp.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const byCat = {}; exp.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
      out += "\n\n" + t("totalLabel") + " (" + CURRENCIES[code] + "): " + money(total, code) + "\n" +
        Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => "- " + catLabel(c) + ": " + money(v, code)).join("\n");
    });
    return out;
  }
  async function shareSummary() {
    const text = summaryText();
    if (navigator.share) { try { await navigator.share({ title: "BudgetAI", text: text }); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(text); alert(t("copied")); } catch (e) { alert(text); }
  }
  function exportPDF() { window.print(); }

  // ---- Seletor de moeda + detecção de local ----
  function setCurCurrency(code) {
    if (!CURRENCIES[code]) return;
    curCurrency = code; curMenuOpen = false;
    try { localStorage.setItem("cur_currency", code); } catch (e) {}
    queueSettingsSave();
    render();
  }
  function toggleCurMenu(e) { if (e) e.stopPropagation(); curMenuOpen = !curMenuOpen; renderCurrencyBar(); }
  function renderCurrencyBar() {
    document.getElementById("curbar").innerHTML =
      '<button class="cur-toggle" onclick="toggleCurMenu(event)">' + FLAGS[curCurrency] + ' ' + CURRENCIES[curCurrency] + ' <span class="caret">▾</span></button>' +
      '<div class="cur-menu' + (curMenuOpen ? ' open' : '') + '">' +
        CUR_ORDER.map(code => '<button class="cur-opt' + (code === curCurrency ? ' active' : '') + '" onclick="setCurCurrency(\'' + code + '\')">' + FLAGS[code] + ' ' + CURRENCIES[code] + '  ' + code + '</button>').join("") +
        '<button class="cur-opt local" onclick="detectCurrency()">📍 ' + t("localCur") + '</button>' +
      '</div>';
  }
  function renderOtherCur() {
    const parts = [];
    CUR_ORDER.forEach(code => {
      if (code === curCurrency) return;
      const tot = expenses.filter(e => expCur(e) === code).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      if (tot > 0) parts.push(money(tot, code));
    });
    document.getElementById("othercur").innerHTML = parts.length ? (t("otherCur") + " " + parts.join(" · ")) : "";
  }
  // Detecta a moeda do lugar (aproximado): 1º tenta GPS, 2º cai pro fuso horário. Nunca mexe nos fixos.
  function currencyFromCoords(lat, lon) {
    if (lat >= 49 && lat <= 61 && lon >= -11 && lon <= 2.5) return "GBP";
    if (lat >= -34 && lat <= 6 && lon >= -74 && lon <= -34) return "BRL";
    if (lat >= 18 && lat <= 50 && lon >= -125 && lon <= -66) return "USD";
    if (lat >= 34 && lat <= 71 && lon >= -11 && lon <= 32) return "EUR";
    return null;
  }
  function currencyFromTZ() {
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      if (tz === "Europe/London") return "GBP";
      if (/Sao_Paulo|Bahia|Fortaleza|Recife|Manaus|Belem|Cuiaba/.test(tz)) return "BRL";
      if (tz.indexOf("Europe/") === 0) return "EUR";
      if (tz.indexOf("America/") === 0) return "USD";
    } catch (e) {}
    return null;
  }
  function detectCurrency() {
    curMenuOpen = false; renderCurrencyBar();
    const apply = code => { if (code && CURRENCIES[code]) setCurCurrency(code); };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => apply(currencyFromCoords(pos.coords.latitude, pos.coords.longitude) || currencyFromTZ()),
        () => apply(currencyFromTZ()),
        { timeout: 8000 }
      );
    } else { apply(currencyFromTZ()); }
  }

  // ---- Liga os botões ----
  document.getElementById("addBtn").onclick = () => addExpense();
  input.addEventListener("keydown", e => { if (e.key === "Enter") addExpense(); });
  document.getElementById("fixedBtn").onclick = () => addFixed();
  fixedInput.addEventListener("keydown", e => { if (e.key === "Enter") addFixed(); });
  document.getElementById("langBtn").onclick = () => {
    lang = lang === "pt" ? "en" : "pt";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    applyStaticTexts(); render(); renderFixed(); applyAuthTexts();
  };

  // ---- Coach wiring ----
  document.getElementById("coachSend").onclick = () => askCoach();
  document.getElementById("coachInput").addEventListener("keydown", e => { if (e.key === "Enter") askCoach(); });
  document.getElementById("pIncome").addEventListener("input", e => { coachProfile.income = e.target.value; saveProfile(); });
  document.getElementById("pGoal").addEventListener("input", e => { coachProfile.goal = e.target.value; saveProfile(); });
  document.getElementById("pRisk").addEventListener("change", e => { coachProfile.risk = e.target.value; saveProfile(); });
  document.getElementById("shareBtn").onclick = () => shareSummary();
  document.getElementById("pdfBtn").onclick = () => exportPDF();

  // ---- Bolinha do coach + painel deslizante ----
  const bubble = document.getElementById("coachBubble");
  const sheet = document.getElementById("coachSheet");
  const panel = document.getElementById("sheetPanel");
  function openSheet() { sheet.classList.add("open"); panel.style.transition = ""; panel.style.transform = ""; }
  function closeSheet() {
    panel.style.transition = "";
    panel.style.transform = "translateX(-50%) translateY(100%)";
    setTimeout(() => { sheet.classList.remove("open"); panel.style.transform = ""; }, 280);
  }
  function placeBubble(left, top) {
    const w = bubble.offsetWidth || 56, h = bubble.offsetHeight || 56;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - h - 8));
    bubble.style.left = left + "px"; bubble.style.top = top + "px";
    bubble.style.right = "auto"; bubble.style.bottom = "auto";
    try { localStorage.setItem("bubble_pos", JSON.stringify({ left: left, top: top })); } catch (e) {}
  }
  (function () {
    let pos = null;
    try { const r = localStorage.getItem("bubble_pos"); if (r) pos = JSON.parse(r); } catch (e) {}
    const w = 56;
    let top = pos ? pos.top : (window.innerHeight - 140);
    let left = pos ? pos.left : (window.innerWidth - w - 16);
    const center = left + w / 2; // sempre começa grudada num dos lados
    left = center < window.innerWidth / 2 ? 16 : window.innerWidth - w - 16;
    placeBubble(left, top);
  })();
  // arrastar a bolinha, e diferenciar de um toque rápido
  let bDrag = false, bMoved = false, bsx = 0, bsy = 0, bl0 = 0, bt0 = 0;
  bubble.addEventListener("pointerdown", e => {
    bDrag = true; bMoved = false; bsx = e.clientX; bsy = e.clientY;
    bl0 = bubble.offsetLeft; bt0 = bubble.offsetTop;
    bubble.style.transition = "none";
    try { bubble.setPointerCapture(e.pointerId); } catch (er) {}
  });
  bubble.addEventListener("pointermove", e => {
    if (!bDrag) return;
    const dx = e.clientX - bsx, dy = e.clientY - bsy;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) bMoved = true;
    if (bMoved) placeBubble(bl0 + dx, bt0 + dy);
  });
  function snapBubbleToEdge() {
    const w = bubble.offsetWidth || 56;
    const center = bubble.offsetLeft + w / 2;
    const left = center < window.innerWidth / 2 ? 16 : window.innerWidth - w - 16;
    bubble.style.transition = "left 0.22s cubic-bezier(.2,.8,.2,1)";
    placeBubble(left, bubble.offsetTop);
    setTimeout(() => { bubble.style.transition = "none"; }, 240);
  }
  bubble.addEventListener("pointerup", () => {
    if (!bDrag) return;
    bDrag = false;
    if (!bMoved) { openSheet(); return; }
    snapBubbleToEdge(); // ao soltar, gruda no canto mais próximo (esquerdo ou direito)
  });
  // arrastar o painel pra baixo (pela alcinha) pra fechar
  const grip = document.getElementById("sheetGrip");
  let sDrag = false, ssy = 0, sdy = 0;
  grip.addEventListener("pointerdown", e => { sDrag = true; ssy = e.clientY; sdy = 0; panel.style.transition = "none"; try { grip.setPointerCapture(e.pointerId); } catch (er) {} });
  grip.addEventListener("pointermove", e => { if (!sDrag) return; sdy = e.clientY - ssy; if (sdy > 0) panel.style.transform = "translateX(-50%) translateY(" + sdy + "px)"; });
  grip.addEventListener("pointerup", () => { if (!sDrag) return; sDrag = false; panel.style.transition = ""; if (sdy > 120) closeSheet(); else panel.style.transform = ""; });
  document.getElementById("sheetBackdrop").addEventListener("click", closeSheet);
  document.addEventListener("click", () => { if (curMenuOpen) { curMenuOpen = false; renderCurrencyBar(); } });
  window.addEventListener("resize", () => {
    const w = bubble.offsetWidth || 56;
    const center = bubble.offsetLeft + w / 2;
    const left = center < window.innerWidth / 2 ? 16 : window.innerWidth - w - 16;
    placeBubble(left, bubble.offsetTop);
  });

  applyStaticTexts();
  render();
  renderFixed();

  // ---- LOGIN (Supabase Auth) ----
  // A publishable key é feita pra viver aqui no navegador — quem protege os dados
  // são as regras de segurança (RLS) que a gente monta no último degrau.
  const SUPA_URL = "https://efytffndatdkvbzeoxgm.supabase.co";
  const SUPA_KEY = "sb_publishable_C9sNWRMrJFzyQQLEi9592Q_dgAYpaBM";
  let sbClient = null;
  try { sbClient = window.supabase.createClient(SUPA_URL, SUPA_KEY); } catch (e) {}
  let currentUserId = null;     // id da pessoa logada (pra carimbar a ficha de configurações)
  let settingsTimer = null;     // espera um tiquinho antes de mandar pra nuvem (evita mandar toda hora)
  let applyingRemote = false;   // enquanto aplico o que veio da nuvem, não reenvio de volta

  const authScreen = document.getElementById("authScreen");
  function showApp() { authScreen.classList.add("hidden"); syncCloud(); }
  function showLogin() { authScreen.classList.remove("hidden"); }

  // ---- NUVEM: gastos no Supabase, amarrados à conta logada ----
  function expenseFromRow(r) {
    return { id: r.id, date: r.date, cur: r.cur, amount: Number(r.amount) || 0, category: r.category, description: r.description };
  }
  async function cloudLoadExpenses() {
    if (!sbClient) return null;
    try {
      const { data, error } = await sbClient.from("expenses").select("*").order("date", { ascending: false });
      if (error || !data) return null;
      return data.map(expenseFromRow);
    } catch (e) { return null; }
  }
  async function cloudInsertExpense(obj) {
    if (!sbClient) return null;
    try {
      const { data, error } = await sbClient.from("expenses")
        .insert({ date: obj.date, cur: obj.cur, amount: obj.amount, category: obj.category, description: obj.description })
        .select().single();
      if (error || !data) return null;
      return expenseFromRow(data);
    } catch (e) { return null; }
  }
  async function cloudDeleteExpense(id) {
    if (!sbClient) return false;
    try {
      const { error } = await sbClient.from("expenses").delete().eq("id", id);
      return !error;
    } catch (e) { return false; }
  }
  // Leva pra nuvem, UMA vez, o que já estava salvo no aparelho antes do login existir
  async function migrateLocalExpenses() {
    if (!sbClient) return;
    try {
      if (localStorage.getItem("migrated_expenses_v1") === "1") return;
      let local = [];
      try { local = JSON.parse(localStorage.getItem("expenses") || "[]"); } catch (e) { local = []; }
      if (local.length) {
        const rows = local.map(e => ({
          date: e.date || new Date().toISOString(),
          cur: e.cur || homeCurrency,
          amount: Number(e.amount) || 0,
          category: e.category || "Outros",
          description: e.description || ""
        }));
        const { error } = await sbClient.from("expenses").insert(rows);
        if (error) return; // se falhou, não marca como migrado — tenta de novo na próxima
      }
      localStorage.setItem("migrated_expenses_v1", "1");
    } catch (e) {}
  }
  let cloudSynced = false;
  async function syncCloud() {
    if (!sbClient || cloudSynced) return;
    cloudSynced = true;
    try { const { data: u } = await sbClient.auth.getUser(); currentUserId = (u && u.user) ? u.user.id : null; } catch (e) {}
    await migrateLocalExpenses();
    const cloud = await cloudLoadExpenses();
    if (cloud) { expenses = cloud; save(); render(); }
    await syncSettings();
  }

  // ---- NUVEM: configurações (fixos, perfil do coach, atalhos, moeda) numa ficha só ----
  function collectSettings() {
    return {
      recurring: recurring,
      quickchips: quickChips,
      coach_profile: coachProfile,
      home_currency: homeCurrency,
      cur_currency: curCurrency
    };
  }
  async function cloudSaveSettings() {
    if (!sbClient || !currentUserId) return;
    try {
      await sbClient.from("settings").upsert(
        { user_id: currentUserId, data: collectSettings(), updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      );
    } catch (e) {}
  }
  function queueSettingsSave() {
    if (!sbClient || applyingRemote) return;
    if (settingsTimer) clearTimeout(settingsTimer);
    settingsTimer = setTimeout(cloudSaveSettings, 800);
  }
  async function cloudLoadSettings() {
    if (!sbClient) return null;
    try {
      const { data, error } = await sbClient.from("settings").select("data").maybeSingle();
      if (error || !data) return null;
      return data.data || null;
    } catch (e) { return null; }
  }
  // Une duas listas sem duplicar (pelo id) — assim nunca se perde o que existe de um lado
  function mergeById(a, b) {
    const out = []; const seen = {};
    [].concat(Array.isArray(a) ? a : [], Array.isArray(b) ? b : []).forEach(item => {
      if (!item || typeof item !== "object") return;
      const key = (item.id != null) ? String(item.id) : JSON.stringify(item);
      if (seen[key]) return;
      seen[key] = 1; out.push(item);
    });
    return out;
  }
  async function syncSettings() {
    if (!sbClient) return;
    const remote = await cloudLoadSettings();
    const r = (remote && typeof remote === "object") ? remote : {};
    applyingRemote = true;
    // FIXOS: JUNTA aparelho + nuvem (nunca apaga um lado pelo outro)
    recurring = mergeById(recurring, r.recurring); saveFixed();
    // ATALHOS: só usa os da nuvem se ela tiver algum
    if (Array.isArray(r.quickchips) && r.quickchips.length) { quickChips = r.quickchips.slice(0, MAX_CHIPS); saveChips(); }
    // PERFIL: só usa o da nuvem se estiver preenchido
    if (r.coach_profile && typeof r.coach_profile === "object" && Object.keys(r.coach_profile).length) { coachProfile = r.coach_profile; saveProfile(); }
    if (r.home_currency && CURRENCIES[r.home_currency]) homeCurrency = r.home_currency;
    if (r.cur_currency && CURRENCIES[r.cur_currency]) { curCurrency = r.cur_currency; try { localStorage.setItem("cur_currency", curCurrency); } catch (e) {} }
    applyingRemote = false;
    // devolve a versão JUNTA pra nuvem, pra ela ficar sempre com o conjunto completo
    await cloudSaveSettings();
    applyStaticTexts(); renderFixed(); renderCurrencyBar(); render();
  }
  function setAuthMsg(text, kind) {
    const m = document.getElementById("authMsg");
    m.textContent = text || "";
    m.className = "auth-msg" + (kind ? " " + kind : "");
  }
  function applyAuthTexts() {
    document.getElementById("authTag").textContent = t("authTag");
    document.getElementById("authEmail").placeholder = t("emailPh");
    document.getElementById("authPass").placeholder = t("passPh");
    document.getElementById("authLoginBtn").textContent = t("login");
    document.getElementById("authSignupBtn").textContent = t("signup");
    const lo = document.getElementById("logoutBtn"); if (lo) lo.textContent = t("logout");
  }
  async function doLogin() {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    if (!email || !pass) { setAuthMsg(t("authFillErr"), "err"); return; }
    if (!sbClient) { setAuthMsg(t("genericErr"), "err"); return; }
    setAuthMsg(t("authLoading"), "");
    try {
      const { error } = await sbClient.auth.signInWithPassword({ email: email, password: pass });
      if (error) { setAuthMsg(t("badLogin"), "err"); return; }
      setAuthMsg("", ""); showApp();
    } catch (e) { setAuthMsg(t("genericErr"), "err"); }
  }
  async function doSignup() {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    if (!email || !pass) { setAuthMsg(t("authFillErr"), "err"); return; }
    if (!sbClient) { setAuthMsg(t("genericErr"), "err"); return; }
    setAuthMsg(t("authLoading"), "");
    try {
      const { data, error } = await sbClient.auth.signUp({ email: email, password: pass });
      if (error) { setAuthMsg(error.message || t("genericErr"), "err"); return; }
      if (data && data.session) { setAuthMsg("", ""); showApp(); return; } // confirmação de email desligada
      setAuthMsg(t("signupOk"), "ok");
    } catch (e) { setAuthMsg(t("genericErr"), "err"); }
  }
  async function doLogout() {
    if (sbClient) { try { await sbClient.auth.signOut(); } catch (e) {} }
    cloudSynced = false; currentUserId = null;
    expenses = []; save();
    // limpa dados pessoais da memória; a próxima conta recarrega os seus da nuvem
    recurring = []; quickChips = DEFAULT_CHIPS.slice(); coachProfile = {};
    applyStaticTexts(); renderFixed(); renderCurrencyBar(); render();
    showLogin();
  }
  async function checkSession() {
    if (!sbClient) { showApp(); return; } // se o Supabase não carregar, não trava o app
    try {
      const { data } = await sbClient.auth.getSession();
      if (data && data.session) showApp(); else showLogin();
    } catch (e) { showLogin(); }
  }
  document.getElementById("authLoginBtn").onclick = doLogin;
  document.getElementById("authSignupBtn").onclick = doSignup;
  document.getElementById("authPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  document.getElementById("authEmail").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("authPass").focus(); });
  const _logoutBtn = document.getElementById("logoutBtn");
  if (_logoutBtn) _logoutBtn.onclick = doLogout;
  applyAuthTexts();
  checkSession();
</script>
