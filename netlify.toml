# ---- Configuração do Netlify ----
# Headers de segurança pra todas as páginas do site.

[build]
  functions = "netlify/functions"

# ---- Emails automáticos (funções agendadas) ----
# O Netlify chama estas funções sozinho, no horário UTC abaixo. Elas usam a
# service_role pra varrer as contas — não recebem pedido do navegador.

# Ativação: todo dia às 10:00 UTC, pega quem criou conta há ~24h e não anotou nada.
[functions."send-activation-email"]
  schedule = "0 10 * * *"

# Resumo semanal: segunda às 9:00 UTC.
[functions."send-weekly-summary"]
  schedule = "0 9 * * 1"

# A Play Store exige a página de exclusão de conta em /delete-account (sem o
# .html). status 200 = reescrita: a URL na barra continua limpa.
[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # O navegador passa a EXIGIR https neste domínio pelos próximos 2 anos,
    # mesmo que alguém tente forçar http (evita interceptação no Wi-Fi público).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Ninguém pode colocar o site dentro de um iframe (evita clickjacking)
    X-Frame-Options = "DENY"
    # O navegador não tenta "adivinhar" tipo de arquivo (evita truques com uploads)
    X-Content-Type-Options = "nosniff"
    # Ao sair do site, só manda o domínio de origem (não a URL inteira)
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Só o próprio site pode pedir localização (usada pra detectar a moeda);
    # câmera, microfone e pagamento ficam desligados
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # Isola a aba: uma janela aberta por outro site não consegue mexer nesta
    Cross-Origin-Opener-Policy = "same-origin"
    # De onde a página pode carregar cada coisa. Qualquer script de um
    # domínio fora desta lista é BLOQUEADO pelo navegador.
    #
    # script-src NÃO tem mais 'unsafe-inline': todo o JS mora em arquivos
    # (/app.js, /index.js, /legal.js) e não sobrou nenhum onclick="..." no HTML.
    # Efeito prático: mesmo que um texto malicioso chegue à tela, o navegador
    # se recusa a executá-lo. É a trava que transforma XSS em texto sem graça.
    #
    # style-src ainda permite inline (os estilos ficam no <style> das páginas).
    # É um risco bem menor: CSS não executa código.
    #
    # O Google Analytics entra por aqui: o gtag.js vem do googletagmanager e
    # manda os eventos pros domínios de coleta (que variam por região, daí os
    # curingas). O bloco que o Google manda colar inline mora em /analytics.js
    # justamente pra não precisarmos reabrir o 'unsafe-inline'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://efytffndatdkvbzeoxgm.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"

# As funções nunca devem ser guardadas em cache por CDN/navegador:
# a resposta depende de QUEM está pedindo (token) e do limite de uso.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# ---- PWA ----
# O service worker NÃO pode ficar preso em cache: se o navegador servir uma
# versão velha, o app pode ficar semanas sem receber correção. Revalida sempre.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# O manifest muda pouco, mas quando muda (ícone, nome) tem que chegar rápido.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ícones são imutáveis: podem ficar em cache longo.
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
