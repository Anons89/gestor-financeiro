<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<!-- Roda antes de a página desenhar: decide se a tela de login deve nascer
     escondida, pra quem já está logado não ver ela piscar. -->
<script src="/boot.js"></script>
<style>
  :root {
    --bg: #0A0E0C; --panel: #12181A; --panel-2: #161D1F; --border: #232C2E; --cream: #EAF1EC;
    --muted: #93A49B; --dim: #6B7A72; --spent: #4ADE80; --paper: #F3F3F9; --ink: #23232E;
    --accent: #34C77B; --accent-2: #4ADE80;
    --btn-bg: #3DD684; --btn-ink: #04220E;
    --font-display: "Space Grotesk", -apple-system, sans-serif;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --r-card: 16px; --r-ctl: 12px; --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(52,199,123,0.30); color: var(--cream); }
  input, select, textarea { caret-color: var(--accent-2); accent-color: var(--accent); }
  body {
    background:
      radial-gradient(1100px 560px at 100% -8%, rgba(74,222,128,0.11), transparent 58%),
      radial-gradient(950px 480px at -12% 6%, rgba(52,199,123,0.07), transparent 55%),
      radial-gradient(900px 700px at 50% 115%, rgba(52,199,123,0.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: calc(44px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* toque com resposta: tudo que é clicável reage ao dedo */
  button { transition: transform .16s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), opacity .18s var(--ease), box-shadow .18s var(--ease); }
  button:not(:disabled):active { transform: scale(0.97); }
  .app { width: 100%; max-width: 440px; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }

  /* ===== marca (topbar) =====
     Lockup marca + nome. Antes era só o nome em texto com gradiente — o
     gradiente em letra é o acabamento que mais entrega "template": a ênfase
     de uma marca vem do peso e do desenho, não de um degradê. */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 2px 0 0; margin-bottom: 18px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; flex-shrink: 0; display: block; }
  .brand-name {
    font-family: var(--font-display);
    font-size: 27px; font-weight: 700;
    /* tracking apertado: o que faz um nome parecer desenhado e não digitado */
    letter-spacing: -0.045em;
    color: var(--cream);
    line-height: 1;
  }
  /* o ponto final é a assinatura da marca — o único lugar onde o verde aparece */
  .brand-dot { color: var(--accent-2); }

  /* ===== telas (abas) ===== */
  .screen { display: none; animation: fadeScreen .3s var(--ease-out); }
  .screen.active { display: block; }
  @keyframes fadeScreen { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* gasto recém-anotado entra deslizando */
  @keyframes itemIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .item.just-added { animation: itemIn .35s var(--ease-out); }

  /* ===== barra de navegação ===== */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 440px; z-index: 60;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-top: 1px solid var(--border); padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
  .nav-btn { background: none; border: none; cursor: pointer; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 4px 0; }
  .nav-btn .ico { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-btn.on { color: var(--spent); }

  /* ===== tela de ajustes ===== */
  .plan-card { background: linear-gradient(165deg, #2FBE75 0%, #17945B 60%, #0C7A4A 100%); color: #FFFFFF; border-radius: var(--r-card); padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 14px 34px -12px rgba(18,150,92,0.5), inset 0 1px 0 rgba(255,255,255,0.22); }
  .plan-1 { font-size: 13px; opacity: 0.92; font-weight: 700; }
  .plan-2 { font-size: 19px; font-weight: 700; margin: 3px 0 8px; }
  .plan-mo { font-size: 13px; font-weight: 600; opacity: 0.85; }
  .plan-3 { font-size: 12.5px; opacity: 0.85; font-weight: 600; }
  .set-group { margin-bottom: 16px; }
  .glabel { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px 8px; }
  .set-list { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: visible; }
  .set-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--border); }
  .set-item:last-child { border-bottom: none; }
  button.set-item { width: 100%; background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; font-size: inherit; cursor: pointer; text-align: left; color: var(--cream); }
  .set-item .chev { color: var(--muted); font-size: 19px; line-height: 1; }
  .set-item.danger .lbl { color: #F87171; }
  .set-item:disabled { opacity: 0.55; }
  .set-item .ic { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: var(--muted); }
  .set-item .ic svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .set-item.danger .ic { color: #F87171; }
  .set-item .lbl { flex: 1; font-weight: 600; font-size: 15px; color: var(--cream); }
  .set-item .curbar { margin: 0; }
  .set-foot { text-align: center; font-size: 12px; color: var(--muted); padding: 12px 0 4px; }
  .analysis-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .analysis-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .analysis-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 10px; }

  /* ===== coach em tela cheia ===== */
  .coach-head { text-align: center; padding: 8px 0 14px; }
  .coach-head .av { width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 10px; background: linear-gradient(135deg, var(--accent), #0B8153); display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 28px rgba(15,157,99,0.35); }
  .coach-head h2 { font-size: 19px; letter-spacing: -0.02em; color: var(--cream); }
  .coach-head p { font-size: 13.5px; color: var(--muted); margin-top: 3px; max-width: 300px; margin-inline: auto; }
  .coach-disclaim { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 10px 0; line-height: 1.5; }
  #s-coach .profile { margin-top: 0; }

  /* ===== seletor de tema ===== */
  .theme-seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 3px; gap: 2px; }
  .theme-seg button { border: none; background: none; padding: 7px 11px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
  .theme-seg button.on { background: var(--panel); color: var(--spent); box-shadow: 0 1px 4px rgba(0,0,0,0.25); }

  /* ===== legenda estilo lista (%, depois valor) ===== */
  .leg { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .leg:last-child { border-bottom: none; }
  .leg .dot { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0; }
  .leg .nm { flex: 1; font-weight: 600; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Colunas de largura FIXA: é o que faz % e valor alinharem verticalmente.
     A do valor cabe até £9999.99 sem empurrar as outras. */
  .leg .pc { font-size: 12px; color: var(--muted); font-weight: 700; width: 44px; text-align: right; flex-shrink: 0; }
  .leg .vl { font-weight: 700; color: var(--cream); width: 92px; text-align: right; flex-shrink: 0; }

  /* ===== insights ===== */
  .insight { display: flex; gap: 12px; align-items: flex-start; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-ctl); padding: 13px 14px; margin-bottom: 10px; }
  .insight:last-child { margin-bottom: 0; }
  .insight .iic { font-size: 22px; line-height: 1; }
  .insight p { font-size: 14px; color: var(--cream); margin: 0; line-height: 1.5; }
  .insight b { color: var(--spent); }

  /* ============ TEMA CLARO ============ */
  [data-theme="light"] {
    --bg: #EEF3F0; --panel: #FFFFFF; --panel-2: #F6FAF7; --border: #DFE9E2; --cream: #0D1A13;
    --muted: #57685F; --dim: #7C8D84; --spent: #0E7C47; --accent: #22B06C; --accent-2: #34C77B;
    --btn-bg: #0E7C47; --btn-ink: #FFFFFF;
  }
  [data-theme="light"] body { background: var(--bg); }
  [data-theme="light"] .msg.user { color: #FFFFFF; }
  [data-theme="light"] .theme-seg button.on { box-shadow: 0 1px 4px rgba(13,26,19,0.15); }
  [data-theme="light"] .nav { background: color-mix(in srgb, #FFFFFF 92%, transparent); }
  /* voz numérica da marca: Space Grotesk com dígitos tabulares (colunas alinham) */
  .mono { font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .item .amount, .fx-amount, .fixed-total, .leg .vl, .leg .pc, .day-total, .plan-2, .pie-center-total, .bar-value, .trust-num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lang { background: var(--panel); border: 1px solid var(--border); color: var(--cream); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .head-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  h1 { font-size: 26px; margin-top: 4px; letter-spacing: -0.01em; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .row { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; padding: 13px 16px; border-radius: 12px; font-size: 14px; background: var(--panel); color: var(--cream); border: 1px solid var(--border); outline: none; }
  input::placeholder { color: var(--dim); }
  button.primary { padding: 13px 18px; border-radius: var(--r-ctl); font-size: 14px; font-weight: 700; background: var(--btn-bg); color: var(--btn-ink); border: none; cursor: pointer; white-space: nowrap; }
  @media (hover: hover) {
    button.primary:not(:disabled):hover { filter: brightness(1.07); }
    .chip:hover { border-color: var(--dim); color: var(--cream); }
    .act:hover, .cur-opt:hover, .cat-opt:hover { background: var(--panel-2); border-color: var(--dim); }
    .tab:not(.active):hover { color: var(--cream); border-color: var(--dim); }
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer; background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .chip-editing { display: inline-flex; align-items: center; border-style: dashed; color: var(--cream); }
  .chip-x { background: none; border: none; color: var(--muted); cursor: pointer; margin-left: 6px; padding: 0; display: inline-flex; align-items: center; }
  .chip-input { flex: none; width: 140px; font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--panel); color: var(--cream); border: 1px solid var(--border); outline: none; }

  .fixed { margin-top: 16px; border-radius: 16px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--border); }
  .fixed-top { display: flex; justify-content: space-between; align-items: baseline; }
  .fixed-title { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
  .fixed-total { font-size: 20px; font-weight: 700; color: var(--cream); }
  .fixed-row { margin-top: 12px; }
  .fixed-list { margin-top: 6px; }
  .fixed-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .fixed-item:last-child { border-bottom: none; }
  .fixed-empty { font-size: 13px; color: var(--dim); padding: 8px 0 2px; }
  .fixed-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fixed-sub b { color: var(--spent); }
  .fx-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .fx-info { display: flex; flex-direction: column; min-width: 0; }
  .fx-name { color: var(--cream); }
  .fx-due { font-size: 11px; color: var(--dim); }
  .fx-right { display: flex; align-items: center; gap: 12px; }
  .fx-amount { color: var(--cream); font-weight: 700; }
  .fx-del { background: none; border: none; color: var(--dim); cursor: pointer; display: inline-flex; align-items: center; padding: 4px; }
  .check { width: 20px; height: 20px; border-radius: 999px; border: 1.5px solid var(--dim); background: transparent; color: #fff; font-size: 12px; line-height: 1; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .fixed-item.paid .fx-name, .fixed-item.paid .fx-amount { text-decoration: line-through; opacity: 0.5; }

  .summary { margin-top: 22px; border-radius: 16px; padding: 20px; background: linear-gradient(155deg, rgba(74,222,128,0.12), rgba(56,224,200,0.06) 55%, var(--panel) 100%); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
  .summary.hero { margin-top: 0; background: linear-gradient(165deg, #2FBE75 0%, #17945B 55%, #0C7A4A 100%); border: none; color: #FFFFFF; position: relative; overflow: hidden; box-shadow: 0 16px 40px -12px rgba(18,150,92,0.5), inset 0 1px 0 rgba(255,255,255,0.22); }
  .summary.hero::after { content: ""; position: absolute; right: -60px; top: -70px; width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.16), transparent 68%); }
  .summary.hero .label { color: rgba(255,255,255,0.9); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .summary.hero .total { color: #FFFFFF; font-size: 42px; }
  .summary.hero .note { color: rgba(255,255,255,0.92); }
  .summary.hero .note b { color: #FFFFFF !important; }
  .card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chips-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
  .chips-card .chips { margin-top: 0; }
  .summary .label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  .summary .total { font-size: 40px; font-weight: 700; color: var(--spent); margin-top: 2px; letter-spacing: -0.02em; }
  .summary .note { font-size: 14px; margin-top: 8px; color: var(--cream); }

  .receipt { margin-top: 14px; border-radius: 16px; overflow: hidden; background: var(--panel); color: var(--cream); border: 1px solid var(--border); }
  .receipt .head { padding: 14px 16px 4px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-family: inherit; }
  .receipt .body { padding: 0 16px 12px; font-family: inherit; }
  .empty { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .item .emo { width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .item .meta { flex: 1; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .item .desc { color: var(--cream); font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .cat-edit { font-size: 12.5px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; margin-top: 1px; }
  .item .cat-edit .pen { opacity: 0.5; font-size: 11px; }
  .item .cat-edit:active { color: var(--cream); }
  /* Modal pra trocar a categoria */
  .cat-picker { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .cat-picker.hidden { display: none; }
  .cat-picker-backdrop { position: absolute; inset: 0; background: rgba(4,8,6,0.62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: pickerFade .2s var(--ease-out); }
  .cat-picker-panel { position: relative; width: 100%; max-width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 18px; animation: pickerPop .3s var(--ease-out); box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6); }
  @keyframes pickerFade { from { opacity: 0; } }
  @keyframes pickerPop { from { opacity: 0; transform: translateY(12px) scale(0.97); } }
  .cat-picker-title { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 12px; text-align: center; }
  .cat-picker-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-opt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--cream); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; font-family: inherit; }
  .cat-opt:active { background: var(--border); }
  .cat-opt .dot { width: 10px; height: 10px; border-radius: 4px; flex-shrink: 0; }
  .item .amount { font-weight: 700; font-size: 15px; color: var(--cream); white-space: nowrap; }
